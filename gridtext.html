<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced 4-Grid Notepad</title>

  <style>
    :root {
      --bg: #1e1e1e;
      --pad-bg: #2c2c2c;
      --text-bg: #111;
      --text-color: #eee;
      --border: #444;
    }

    body.light {
      --bg: #f4f4f4;
      --pad-bg: #fff;
      --text-bg: #f9f9f9;
      --text-color: #000;
      --border: #ccc;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text-color);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      transition: 0.3s;
    }

    .theme-toggle {
      position: fixed;
      top: 15px;
      right: 15px;
      padding: 8px 14px;
      background: var(--pad-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-color);
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 20px;
      width: 90vw;
      height: 90vh;
    }

    .notepad {
      background-color: var(--pad-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    /* Changed from textarea to contenteditable */
    .editor {
      background: var(--text-bg);
      color: var(--text-color);
      border: none;
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      border-radius: 4px;
      outline: none;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .editor:empty:before {
      content: attr(data-placeholder);
      color: #888;
      pointer-events: none;
    }

    .notepad-title {
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 1.1rem;
      text-align: center;
    }

    .counter {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--text-color);
      text-align: right;
      opacity: 0.8;
    }

    .clear-btn {
      margin-top: 5px;
      padding: 5px 10px;
      background: #b44;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      align-self: flex-end;
      font-size: 0.8rem;
    }

    .clear-btn:hover {
      background: #d55;
    }

    /* Highlight popup */
    .highlight-menu {
      position: fixed;
      display: none;
      z-index: 9999;
      background: #222;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 5px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    .highlight-menu button {
      border: none;
      border-radius: 5px;
      padding: 7px 10px;
      margin: 2px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .yellow-btn {
      background: #ffe66d;
      color: #222;
    }

    .green-btn {
      background: #8be28b;
      color: #222;
    }

    .clear-highlight-btn {
      background: #555;
      color: white;
    }

    .highlight-menu button:hover {
      transform: scale(1.05);
    }

    /* Highlight colors */
    .highlight-yellow {
      background-color: #ffe66d;
      color: #000;
    }

    .highlight-green {
      background-color: #8be28b;
      color: #000;
    }
  </style>
</head>

<body>

  <button class="theme-toggle" onclick="toggleTheme()">
    Toggle Theme
  </button>

  <div class="grid-container">

    <div class="notepad">
      <div class="notepad-title">Notebook 1</div>

      <div
        class="editor"
        id="note1"
        contenteditable="true"
        data-placeholder="Write here..."
      ></div>

      <div class="counter"></div>

      <button class="clear-btn" onclick="clearPad('note1')">
        Clear
      </button>
    </div>


    <div class="notepad">
      <div class="notepad-title">Notebook 2</div>

      <div
        class="editor"
        id="note2"
        contenteditable="true"
        data-placeholder="Write here..."
      ></div>

      <div class="counter"></div>

      <button class="clear-btn" onclick="clearPad('note2')">
        Clear
      </button>
    </div>


    <div class="notepad">
      <div class="notepad-title">Notebook 3</div>

      <div
        class="editor"
        id="note3"
        contenteditable="true"
        data-placeholder="Write here..."
      ></div>

      <div class="counter"></div>

      <button class="clear-btn" onclick="clearPad('note3')">
        Clear
      </button>
    </div>


    <div class="notepad">
      <div class="notepad-title">Notebook 4</div>

      <div
        class="editor"
        id="note4"
        contenteditable="true"
        data-placeholder="Write here..."
      ></div>

      <div class="counter"></div>

      <button class="clear-btn" onclick="clearPad('note4')">
        Clear
      </button>
    </div>

  </div>


  <!-- Highlight menu -->
  <div class="highlight-menu" id="highlightMenu">

    <button
      class="yellow-btn"
      onclick="applyHighlight('yellow')"
    >
      🟨 Yellow
    </button>

    <button
      class="green-btn"
      onclick="applyHighlight('green')"
    >
      🟩 Green
    </button>

    <button
      class="clear-highlight-btn"
      onclick="applyHighlight('clear')"
    >
      ❌ Clear
    </button>

  </div>


<script>

  let savedSelection = null;


  // -----------------------------------------
  // COUNTER
  // -----------------------------------------

  function updateCount(editor) {

    const text = editor.innerText || "";

    const words =
      text.trim() === ""
        ? 0
        : text.trim().split(/\s+/).length;

    const charsWithSpaces = text.length;

    const charsNoSpaces =
      text.replace(/\s+/g, "").length;

    const lines =
      text === ""
        ? 1
        : text.split(/\n/).length;

    const counter =
      editor.parentElement.querySelector(".counter");

    counter.textContent =
      `Words: ${words} | ` +
      `Chars: ${charsWithSpaces} ` +
      `(no spaces: ${charsNoSpaces}) | ` +
      `Lines: ${lines}`;
  }


  // -----------------------------------------
  // SAVE NOTES
  // -----------------------------------------

  function saveNote() {

    const notes = {};

    for (let i = 1; i <= 4; i++) {

      const editor =
        document.getElementById(`note${i}`);

      /*
        innerHTML is saved instead of innerText
        so highlighted spans are preserved.
      */

      notes[`note${i}`] = editor.innerHTML;
    }

    localStorage.setItem(
      "notes",
      JSON.stringify(notes)
    );
  }


  // -----------------------------------------
  // LOAD NOTES
  // -----------------------------------------

  function loadNotes() {

    const saved =
      JSON.parse(localStorage.getItem("notes"));

    if (!saved) return;

    for (let i = 1; i <= 4; i++) {

      const editor =
        document.getElementById(`note${i}`);

      if (saved[`note${i}`]) {

        editor.innerHTML =
          saved[`note${i}`];

        updateCount(editor);
      }
    }
  }


  // -----------------------------------------
  // CLEAR NOTE
  // -----------------------------------------

  function clearPad(id) {

    const editor =
      document.getElementById(id);

    editor.innerHTML = "";

    updateCount(editor);

    saveNote();
  }


  // -----------------------------------------
  // THEME
  // -----------------------------------------

  function toggleTheme() {

    document.body.classList.toggle("light");

    localStorage.setItem(
      "theme",
      document.body.classList.contains("light")
        ? "light"
        : "dark"
    );
  }


  function loadTheme() {

    const savedTheme =
      localStorage.getItem("theme");

    if (savedTheme === "light") {
      document.body.classList.add("light");
    }
  }


  // -----------------------------------------
  // SHOW HIGHLIGHT MENU
  // -----------------------------------------

  document.addEventListener("mouseup", function(e) {

    const selection =
      window.getSelection();

    if (!selection || selection.isCollapsed) {

      /*
        Don't immediately hide if the click
        happened inside the highlight menu.
      */

      if (!e.target.closest(".highlight-menu")) {
        hideHighlightMenu();
      }

      return;
    }


    const range =
      selection.getRangeAt(0);

    const editor =
      range.commonAncestorContainer
        .parentElement
        ?.closest(".editor");


    // Only show menu for selections inside grid editors
    if (!editor) {

      hideHighlightMenu();

      return;
    }


    // Save the selection
    savedSelection = range.cloneRange();


    // Get selection position
    const rect =
      range.getBoundingClientRect();

    const menu =
      document.getElementById("highlightMenu");


    menu.style.display = "block";


    let left =
      rect.left +
      rect.width / 2 -
      100;

    let top =
      rect.top - 50;


    // Keep menu inside screen
    if (left < 5) {
      left = 5;
    }

    if (left + 210 > window.innerWidth) {
      left = window.innerWidth - 215;
    }

    if (top < 5) {
      top = rect.bottom + 5;
    }


    menu.style.left =
      left + "px";

    menu.style.top =
      top + "px";
  });


  // -----------------------------------------
  // APPLY HIGHLIGHT
  // -----------------------------------------

  function applyHighlight(type) {

    if (!savedSelection) return;


    const selection =
      window.getSelection();

    selection.removeAllRanges();

    selection.addRange(
      savedSelection
    );


    if (selection.isCollapsed) {

      hideHighlightMenu();

      return;
    }


    const range =
      selection.getRangeAt(0);


    /*
      Make sure the selection is inside
      one of the four grid editors.
    */

    const editor =
      range.commonAncestorContainer
        .parentElement
        ?.closest(".editor");


    if (!editor) {

      hideHighlightMenu();

      return;
    }


    if (type === "clear") {

      removeHighlight(range);

    } else {

      const span =
        document.createElement("span");

      span.className =
        type === "yellow"
          ? "highlight-yellow"
          : "highlight-green";


      try {

        span.appendChild(
          range.extractContents()
        );

        range.insertNode(span);

      } catch (error) {

        console.log(
          "Highlight error:",
          error
        );

      }
    }


    updateCount(editor);

    saveNote();

    selection.removeAllRanges();

    savedSelection = null;

    hideHighlightMenu();
  }


  // -----------------------------------------
  // CLEAR HIGHLIGHT
  // -----------------------------------------

  function removeHighlight(range) {

    /*
      Find highlighted elements within
      the selected area.
    */

    const container =
      range.commonAncestorContainer;

    const parent =
      container.nodeType === 1
        ? container
        : container.parentElement;


    const highlights =
      parent.querySelectorAll(
        ".highlight-yellow, .highlight-green"
      );


    highlights.forEach(function(span) {

      /*
        Check if span intersects selection
      */

      try {

        if (
          range.intersectsNode(span)
        ) {

          const text =
            document.createTextNode(
              span.textContent
            );

          span.replaceWith(text);
        }

      } catch (e) {}

    });
  }


  // -----------------------------------------
  // HIDE MENU
  // -----------------------------------------

  function hideHighlightMenu() {

    const menu =
      document.getElementById("highlightMenu");

    menu.style.display = "none";
  }


  // -----------------------------------------
  // EDITOR INPUT
  // -----------------------------------------

  document.querySelectorAll(".editor")
    .forEach(function(editor) {

      editor.addEventListener(
        "input",
        function() {

          updateCount(this);

          saveNote();
        }
      );

    });


  // -----------------------------------------
  // CLICK OUTSIDE MENU
  // -----------------------------------------

  document.addEventListener(
    "mousedown",
    function(e) {

      const menu =
        document.getElementById(
          "highlightMenu"
        );

      if (
        menu.style.display === "block" &&
        !e.target.closest(".highlight-menu")
      ) {

        /*
          Don't hide before mouseup selection
          is completed.
        */

      }
    }
  );


  // -----------------------------------------
  // INITIAL LOAD
  // -----------------------------------------

  loadTheme();

  loadNotes();


  // Update counters even for empty notebooks
  for (let i = 1; i <= 4; i++) {

    const editor =
      document.getElementById(`note${i}`);

    updateCount(editor);
  }

</script>

</body>
</html>
