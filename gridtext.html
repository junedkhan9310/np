<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced 4-Grid Notepad</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --pad-bg: #2c2c2c;
      --text-bg: #111;
      --text-color: #eee;
      --border: #444;
    }

    body.light {
      --bg: #f4f4f4;
      --pad-bg: #fff;
      --text-bg: #f9f9f9;
      --text-color: #000;
      --border: #ccc;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text-color);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      transition: 0.3s;
    }

    .theme-toggle {
      position: fixed;
      top: 15px;
      right: 15px;
      padding: 8px 14px;
      background: var(--pad-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-color);
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 20px;
      width: 90vw;
      height: 90vh;
    }

    .notepad {
      background-color: var(--pad-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .note-editor {
      background: var(--text-bg);
      color: var(--text-color);
      border: none;
      resize: none;
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      border-radius: 4px;
      outline: none;
      white-space: pre-wrap;
      overflow: auto;
      min-height: 120px;
      line-height: 1.5;
    }

    .note-editor:empty::before {
      content: attr(data-placeholder);
      color: rgba(255, 255, 255, 0.45);
      pointer-events: none;
    }

    .notepad-title {
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 1.1rem;
      text-align: center;
    }

    .counter {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--text-color);
      text-align: right;
      opacity: 0.8;
    }

    .clear-btn {
      margin-top: 5px;
      padding: 5px 10px;
      background: #b44;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      align-self: flex-end;
      font-size: 0.8rem;
    }

    .clear-btn:hover {
      background: #d55;
    }

    .highlight-toolbar {
      position: fixed;
      z-index: 20;
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(20, 20, 20, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      border-radius: 10px;
      padding: 8px 10px;
      transform: translateY(-12px);
    }

    .highlight-toolbar.visible {
      display: flex;
    }

    .highlight-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .highlight-btn:hover {
      transform: scale(1.08);
    }

    .highlight-btn.clear {
      width: auto;
      height: auto;
      border-radius: 6px;
      padding: 5px 8px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: #444;
      font-size: 0.72rem;
    }

    .note-editor mark {
      padding: 0 2px;
      border-radius: 3px;
      color: rgba(0, 0, 0, 0.8);
    }
  </style>
</head>

<body>

  <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>

  <div class="grid-container">
    <div class="notepad">
      <div class="notepad-title">Notebook 1</div>
      <div class="note-editor" id="note1" data-placeholder="Write here..." contenteditable="true"></div>
      <div class="counter"></div>
      <button class="clear-btn" onclick="clearPad('note1')">Clear</button>
    </div>

    <div class="notepad">
      <div class="notepad-title">Notebook 2</div>
      <div class="note-editor" id="note2" data-placeholder="Write here..." contenteditable="true"></div>
      <div class="counter"></div>
      <button class="clear-btn" onclick="clearPad('note2')">Clear</button>
    </div>

    <div class="notepad">
      <div class="notepad-title">Notebook 3</div>
      <div class="note-editor" id="note3" data-placeholder="Write here..." contenteditable="true"></div>
      <div class="counter"></div>
      <button class="clear-btn" onclick="clearPad('note3')">Clear</button>
    </div>

    <div class="notepad">
      <div class="notepad-title">Notebook 4</div>
      <div class="note-editor" id="note4" data-placeholder="Write here..." contenteditable="true"></div>
      <div class="counter"></div>
      <button class="clear-btn" onclick="clearPad('note4')">Clear</button>
    </div>
  </div>

  <div id="highlightToolbar" class="highlight-toolbar" aria-label="Highlight text">
    <button class="highlight-btn" type="button" data-color="#ffe066" style="background:#ffe066" title="Yellow highlight"></button>
    <button class="highlight-btn" type="button" data-color="#7ae582" style="background:#7ae582" title="Green highlight"></button>
    <button class="highlight-btn" type="button" data-color="#ffb3c1" style="background:#ffb3c1" title="Pink highlight"></button>
    <button class="highlight-btn clear" type="button" data-clear="true" title="Clear highlight">Clear</button>
  </div>

<script>
  const highlightToolbar = document.getElementById("highlightToolbar");

  function updateCount(editor) {
    const text = editor.textContent || "";
    const words = text.trim() === "" ? 0 : text.trim().split(/\s+/).length;
    const charsWithSpaces = text.length;
    const charsNoSpaces = text.replace(/\s+/g, "").length;
    const lines = text.split(/\n/).length;

    const counter = editor.parentElement.querySelector(".counter");
    counter.textContent =
      `Words: ${words} | ` +
      `Chars: ${charsWithSpaces} (no spaces: ${charsNoSpaces}) | ` +
      `Lines: ${lines}`;
  }

  function saveNote() {
    const notes = {
      note1: document.getElementById("note1").innerHTML,
      note2: document.getElementById("note2").innerHTML,
      note3: document.getElementById("note3").innerHTML,
      note4: document.getElementById("note4").innerHTML
    };
    localStorage.setItem("notes", JSON.stringify(notes));
  }

  function loadNotes() {
    const saved = JSON.parse(localStorage.getItem("notes"));
    if (!saved) return;

    for (let i = 1; i <= 4; i++) {
      const box = document.getElementById(`note${i}`);
      if (saved[`note${i}`]) {
        box.innerHTML = saved[`note${i}`];
        updateCount(box);
      }
    }
  }

  function clearPad(id) {
    const editor = document.getElementById(id);
    editor.innerHTML = "";
    updateCount(editor);
    saveNote();
    hideHighlightToolbar();
  }

  function toggleTheme() {
    document.body.classList.toggle("light");
    localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
  }

  function loadTheme() {
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "light") {
      document.body.classList.add("light");
    }
  }

  function positionHighlightToolbar() {
    const selection = window.getSelection();
    if (!selection || selection.rangeCount === 0 || selection.isCollapsed) {
      hideHighlightToolbar();
      return;
    }

    const range = selection.getRangeAt(0);
    const rect = range.getBoundingClientRect();

    if (!rect.width && !rect.height) {
      hideHighlightToolbar();
      return;
    }

    highlightToolbar.style.left = `${rect.left + (rect.width / 2) - 80}px`;
    highlightToolbar.style.top = `${window.scrollY + rect.top - 50}px`;
    highlightToolbar.classList.add("visible");
  }

  function hideHighlightToolbar() {
    highlightToolbar.classList.remove("visible");
  }

  function applyHighlight(color) {
    document.execCommand("hiliteColor", false, color);
    setTimeout(() => {
      const activeEditor = document.activeElement;
      if (activeEditor && activeEditor.classList.contains("note-editor")) {
        updateCount(activeEditor);
        saveNote();
      }
    }, 0);
    positionHighlightToolbar();
  }

  function clearHighlight() {
    document.execCommand("removeFormat", false, null);
    setTimeout(() => {
      const activeEditor = document.activeElement;
      if (activeEditor && activeEditor.classList.contains("note-editor")) {
        updateCount(activeEditor);
        saveNote();
      }
    }, 0);
    hideHighlightToolbar();
  }

  document.addEventListener("selectionchange", function () {
    const selection = window.getSelection();
    if (!selection || selection.rangeCount === 0) {
      hideHighlightToolbar();
      return;
    }

    const activeElement = selection.anchorNode && selection.anchorNode.parentElement;
    if (activeElement && activeElement.classList.contains("note-editor")) {
      positionHighlightToolbar();
    } else {
      hideHighlightToolbar();
    }
  });

  document.addEventListener("mouseup", function () {
    const selection = window.getSelection();
    if (!selection || selection.isCollapsed) {
      hideHighlightToolbar();
      return;
    }

    const activeElement = selection.anchorNode && selection.anchorNode.parentElement;
    if (activeElement && activeElement.classList.contains("note-editor")) {
      positionHighlightToolbar();
    }
  });

  document.addEventListener("keyup", function () {
    const selection = window.getSelection();
    const activeElement = document.activeElement;
    if (selection && !selection.isCollapsed && activeElement && activeElement.classList.contains("note-editor")) {
      positionHighlightToolbar();
    }
  });

  document.querySelectorAll(".highlight-btn").forEach((button) => {
    button.addEventListener("mousedown", function (event) {
      event.preventDefault();
    });

    button.addEventListener("click", function () {
      if (this.dataset.clear === "true") {
        clearHighlight();
      } else {
        applyHighlight(this.dataset.color);
      }
    });
  });

  document.querySelectorAll(".note-editor").forEach((editor) => {
    editor.addEventListener("input", function () {
      updateCount(this);
      saveNote();
    });

    editor.addEventListener("focus", function () {
      if (window.getSelection() && !window.getSelection().isCollapsed) {
        positionHighlightToolbar();
      }
    });

    editor.addEventListener("blur", function () {
      setTimeout(hideHighlightToolbar, 100);
    });
  });

  loadTheme();
  loadNotes();
  document.querySelectorAll(".note-editor").forEach((editor) => updateCount(editor));
</script>

</body>
</html>
